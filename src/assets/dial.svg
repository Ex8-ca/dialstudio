<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400">
  <!-- Original top-down drawing of a 3 + 4 key dial with one knob. Not a copy of any product artwork. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2b31"/>
      <stop offset="1" stop-color="#1c1c21"/>
    </linearGradient>
    <linearGradient id="well" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0c0f"/>
      <stop offset="1" stop-color="#16161a"/>
    </linearGradient>
    <radialGradient id="ringfill" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#1a1a1f"/>
      <stop offset="1" stop-color="#0d0d10"/>
    </radialGradient>
  </defs>
  <rect x="10" y="6" width="460" height="388" rx="34" fill="#08080a"/>
  <rect x="12" y="8" width="456" height="384" rx="32" fill="url(#body)" stroke="#3a3a42" stroke-width="2"/>
  <!-- key wells: top row -->
  <rect x="66" y="30" width="108" height="92" rx="14" fill="url(#well)" stroke="#34343c" stroke-width="2"/>
  <rect x="186" y="30" width="108" height="92" rx="14" fill="url(#well)" stroke="#34343c" stroke-width="2"/>
  <rect x="306" y="30" width="108" height="92" rx="14" fill="url(#well)" stroke="#34343c" stroke-width="2"/>
  <!-- key wells: sides -->
  <rect x="30" y="146" width="86" height="92" rx="14" fill="url(#well)" stroke="#34343c" stroke-width="2"/>
  <rect x="364" y="146" width="86" height="92" rx="14" fill="url(#well)" stroke="#34343c" stroke-width="2"/>
  <rect x="30" y="256" width="86" height="92" rx="14" fill="url(#well)" stroke="#34343c" stroke-width="2"/>
  <rect x="364" y="256" width="86" height="92" rx="14" fill="url(#well)" stroke="#34343c" stroke-width="2"/>
  <!-- knob seat -->
  <circle cx="240" cy="260" r="110" fill="#0b0b0e" stroke="#34343c" stroke-width="2"/>
  <circle cx="240" cy="260" r="104" fill="none" stroke="#202026" stroke-width="2"/>
  <!-- tick marks around the seat -->
  <g stroke="#3d3d46" stroke-width="2" stroke-linecap="round">
    <line x1="240" y1="146" x2="240" y2="154"/>
    <line x1="296.9" y1="161.3" x2="293" y2="168.2"/>
    <line x1="183.1" y1="161.3" x2="187" y2="168.2"/>
    <line x1="334.7" y1="203.3" x2="327.9" y2="207.3"/>
    <line x1="145.3" y1="203.3" x2="152.1" y2="207.3"/>
  </g>
  <!-- quiet corner screws -->
  <g fill="#15151a" stroke="#3a3a42" stroke-width="1.5">
    <circle cx="40" cy="26" r="5"/><circle cx="440" cy="26" r="5"/>
    <circle cx="40" cy="374" r="5"/><circle cx="440" cy="374" r="5"/>
  </g>
</svg>
