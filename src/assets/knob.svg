<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Knob cap, drawn so that it can be rotated: a marker at twelve o'clock shows the turn. -->
  <defs>
    <radialGradient id="cap" cx="0.42" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#3a3a43"/>
      <stop offset="1" stop-color="#1d1d23"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="#101013" stroke="#3a3a42" stroke-width="2"/>
  <g stroke="#2c2c33" stroke-width="2" stroke-linecap="round">
    <!-- grip notches around the rim -->
    <line x1="100" y1="6" x2="100" y2="14" transform="rotate(0 100 100)"/>
    <line x1="100" y1="6" x2="100" y2="14" transform="rotate(15 100 100)"/>
    <line x1="100" y1="6" x2="100" y2="14" transform="rotate(30 100 100)"/>
    <line x1="100" y1="6" x2="100" y2="14" transform="rotate(45 100 100)"/>
    <line x1="100" y1="6" x2="100" y2="14" transform="rotate(60 100 100)"/>
    <line x1="100" y1="6" x2="100" y2="14" transform="rotate(75 100 100)"/>
    <line x1="100" y1="6" x2="100" y2="14" transform="rotate(90 100 100)"/>
    <line x1="100" y1="6" x2="100" y2="14" transform="rotate(105 100 100)"/>
    <line x1="100" y1="6" x2="100" y2="14" transform="rotate(120 100 100)"/>
    <line x1="100" y1="6" x2="100" y2="14" transform="rotate(135 100 100)"/>
    <line x1="100" y1="6" x2="100" y2="14" transform="rotate(150 100 100)"/>
    <line x1="100" y1="6" x2="100" y2="14" transform="rotate(165 100 100)"/>
    <line x1="100" y1="6" x2="100" y2="14" transform="rotate(180 100 100)"/>
    <line x1="100" y1="6" x2="100" y2="14" transform="rotate(195 100 100)"/>
    <line x1="100" y1="6" x2="100" y2="14" transform="rotate(210 100 100)"/>
    <line x1="100" y1="6" x2="100" y2="14" transform="rotate(225 100 100)"/>
    <line x1="100" y1="6" x2="100" y2="14" transform="rotate(240 100 100)"/>
    <line x1="100" y1="6" x2="100" y2="14" transform="rotate(255 100 100)"/>
    <line x1="100" y1="6" x2="100" y2="14" transform="rotate(270 100 100)"/>
    <line x1="100" y1="6" x2="100" y2="14" transform="rotate(285 100 100)"/>
    <line x1="100" y1="6" x2="100" y2="14" transform="rotate(300 100 100)"/>
    <line x1="100" y1="6" x2="100" y2="14" transform="rotate(315 100 100)"/>
    <line x1="100" y1="6" x2="100" y2="14" transform="rotate(330 100 100)"/>
    <line x1="100" y1="6" x2="100" y2="14" transform="rotate(345 100 100)"/>
  </g>
  <circle cx="100" cy="100" r="80" fill="url(#cap)" stroke="#44444e" stroke-width="2"/>
  <circle cx="100" cy="100" r="66" fill="none" stroke="#2a2a31" stroke-width="2"/>
  <rect x="96" y="22" width="8" height="22" rx="4" fill="#d8d8df"/>
</svg>
